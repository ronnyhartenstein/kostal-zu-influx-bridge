flat_registers:
  # --- Gerätestatus & System ---
  - name: wechselrichter_status
    address: 56
    type: u16
    unit: ""
    enum_map:
      "0": "Off"
      "1": "Init"
      "2": "IsoMeas"
      "3": "GridCheck"
      "4": "StartUp"
      "6": "FeedIn"
      "7": "Throttled"
      "8": "ExtSwitchOff"
      "9": "Update"
      "10": "Standby"
      "11": "GridSync"
      "12": "GridPreCheck"
      "13": "GridSwitchOff"
      "14": "Overheating"
      "15": "Shutdown"
      "16": "ImproperDcVoltage"

