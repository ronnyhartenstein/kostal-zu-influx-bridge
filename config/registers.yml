  "802":
    # SunSpec Battery Base Model. Scale Factors liegen in den Offsets 50-61.
    # Nicht exportiert: AHRtg und WHRtg (Offsets 0, 1), sie doppeln Register 512 und 1068, siehe spec/datenmodell.md.
